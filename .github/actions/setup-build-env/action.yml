# The build environment every workflow shares (docs/architecture.md §10.2):
# one definition of the JDK, Gradle, the Android SDK and the Kotlin/Native
# toolchain cache, so the build gate, the upstream alignment and the release
# cannot drift apart. macOS runners only: the iOS targets need them, and the
# command-line tools fetched below are the macOS distribution.
name: Set up the Sokkuri build environment
description: JDK 21 (Azul Zulu), Gradle with caching, the Android SDK, the Kotlin/Native toolchain cache and, on request, the pinned Rust toolchain.

inputs:
  kotlin-native:
    description: Restore and save the Kotlin/Native toolchain (~/.konan). Only jobs that compile Apple targets need it.
    required: false
    default: "true"
  rust:
    description: Install the Rust toolchain pinned in tools/sok-rs/rust-toolchain.toml and cache cargo. Only the independent .sok reader needs it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Zulu rather than another distribution: gradle/gradle-daemon-jvm.properties
    # pins the daemon to Azul 21, and any other vendor makes Gradle provision a
    # second JDK on every run.
    - uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: "21"

    # Deliberately v5: v6 moved the caching into a proprietary component whose
    # terms of use the upgrade accepts, which is a project decision, not a bump.
    - uses: gradle/actions/setup-gradle@v5

    - name: Cache the Kotlin/Native toolchain
      if: inputs.kotlin-native == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          konan-${{ runner.os }}-${{ runner.arch }}-

    # The macOS runner carries no Android SDK, and android-actions/
    # setup-android@v3 is unusable: it unconditionally installs the deprecated
    # `tools` package, which no longer exists in the Google repository, and
    # hard-fails (v0.1.0-rc.1 CI run). The command-line tools are installed
    # directly and cached under a key naming every component; keep the key and
    # the sdkmanager arguments in step with android-compileSdk in
    # gradle/libs.versions.toml. AGP picks up ANDROID_HOME and can
    # auto-download anything still missing against the accepted licenses.
    - name: Cache the Android SDK
      id: android-sdk
      uses: actions/cache@v6
      with:
        path: ~/android-sdk
        key: android-sdk-${{ runner.os }}-${{ runner.arch }}-cmdline-11076708-build-tools-37.0.0-platform-37.0

    - name: Install the Android SDK
      if: steps.android-sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sdk_root="$HOME/android-sdk"
        mkdir -p "$sdk_root/cmdline-tools"
        curl -fsSLo "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip"
        unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk_root/cmdline-tools"
        mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
        sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        # `yes` dies of SIGPIPE once sdkmanager stops reading; under the
        # pipefail of `shell: bash` that would fail the step, so only
        # sdkmanager's own status may decide.
        { yes || true; } | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
        "$sdkmanager" --sdk_root="$sdk_root" "build-tools;37.0.0"
        # API 37 (Android 17) is still a preview platform: absent from the
        # stable manifest (repository2-1.xml stops at android-36), so it must
        # come from the canary channel as "android-37.0".
        { yes || true; } | "$sdkmanager" --sdk_root="$sdk_root" --channel=3 "platforms;android-37.0"

    - name: Point Gradle at the Android SDK
      shell: bash
      run: |
        echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

    # The independent .sok reader (docs/design/sok-rs.md §10.2). The version
    # comes from its rust-toolchain.toml, the one place that pins it; rustup is
    # preinstalled on the macOS runners, and installed here if an image drops it.
    - name: Install the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' tools/sok-rs/rust-toolchain.toml)
        if [ -z "$version" ]; then
          echo "::error file=tools/sok-rs/rust-toolchain.toml::no channel line to install"
          exit 1
        fi
        if ! command -v rustup > /dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy

    - name: Cache cargo
      if: inputs.rust == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          tools/sok-rs/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/sok-rs/rust-toolchain.toml', 'tools/sok-rs/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-
