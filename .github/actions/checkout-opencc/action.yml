# Fetches the OpenCC reference clone into ./OpenCC, where every tool and test
# expects it (docs/architecture.md §10.2). A shallow fetch of one commit is
# enough: the tools read only the working tree, and OpenCC's cmake falls back
# to a default version string when no tags are present. This is the one place
# that knows how the clone is obtained.
name: Check out the OpenCC reference clone
description: Fetches BYVoid/OpenCC at the commit pinned in testcases/UPSTREAM, or at upstream HEAD, into ./OpenCC.

inputs:
  revision:
    description: "'pinned' for the commit recorded in testcases/UPSTREAM, 'head' for upstream's default branch."
    required: false
    default: pinned

outputs:
  sha:
    description: The OpenCC commit checked out.
    value: ${{ steps.fetch.outputs.sha }}
  pinned-sha:
    description: The OpenCC commit pinned in testcases/UPSTREAM.
    value: ${{ steps.pin.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Read the pinned commit
      id: pin
      shell: bash
      run: |
        upstream_note=sokkuri-runtime/src/commonTest/resources/testcases/UPSTREAM
        sha=$(awk '/^Commit:/ { print $2 }' "$upstream_note")
        if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error file=$upstream_note::no 40-hex 'Commit:' line to pin OpenCC to"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Fetch OpenCC
      id: fetch
      shell: bash
      env:
        REVISION: ${{ inputs.revision }}
        PINNED: ${{ steps.pin.outputs.sha }}
      run: |
        case "$REVISION" in
          pinned) ref="$PINNED" ;;
          head) ref=HEAD ;;
          *)
            echo "::error::unknown revision '$REVISION' (expected 'pinned' or 'head')"
            exit 1
            ;;
        esac
        rm -rf OpenCC
        git init -q OpenCC
        git -C OpenCC remote add origin https://github.com/BYVoid/OpenCC.git
        git -C OpenCC fetch -q --depth 1 origin "$ref"
        git -C OpenCC checkout -q --detach FETCH_HEAD
        echo "sha=$(git -C OpenCC rev-parse HEAD)" >> "$GITHUB_OUTPUT"
