# Release workflow: a pushed v* tag is the only trigger. The tagged commit is
# built and tested on all platforms first (./gradlew build is the gate), then
# uploaded to Maven Central as a USER_MANAGED deployment (manual mode, see
# docs/milestones/m4-distribution.md sections 3.2/3.3). Releasing the deployment
# stays a deliberate one-click step in the Central Portal UI; flip to
# publishAndReleaseToMavenCentral only after the manual flow has proven itself.
name: Release

on:
  push:
    tags:
      - "v*"

# Portal uploads are not idempotent; never run two builds for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # macOS is required: the library ships iosArm64/iosSimulatorArm64 targets
    # and `build` runs the iOS simulator test suite as part of the gate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # The macOS runner carries no Android SDK, and android-actions/
      # setup-android@v3 is unusable: it unconditionally installs the
      # deprecated `tools` package, which no longer exists in the Google
      # repository, and hard-fails (v0.1.0-rc.1 CI run). Install the
      # command-line tools directly; AGP picks up ANDROID_HOME and can
      # auto-download anything still missing against the accepted licenses.
      - name: Install Android SDK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-37" "build-tools;37.0.0"

      - name: Build and test all platforms
        run: ./gradlew build

      - name: Publish to Maven Central (USER_MANAGED deployment)
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          # signingInMemoryKeyId is intentionally not set: the keyring holds a
          # single key (auto-selected), Gradle rejects 16-char fingerprints,
          # and a wrong 8-char id fails the build (m4 doc, step 2 record).
