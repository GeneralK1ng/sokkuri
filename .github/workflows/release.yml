# Release workflow: a pushed v* tag is the only trigger. The tagged commit is
# built and tested on all platforms first (./gradlew build is the gate), then
# uploaded to Maven Central as a USER_MANAGED deployment (manual mode).
# Releasing the deployment stays a deliberate one-click step in the Central
# Portal UI; flip to publishAndReleaseToMavenCentral only after the manual
# flow has proven itself.
name: Release

on:
  push:
    tags:
      - "v*"

# Portal uploads are not idempotent; never run two builds for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # macOS is required: the library ships iosArm64/iosSimulatorArm64 targets
    # and `build` runs the iOS simulator test suite as part of the gate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build-env

      - name: Build and test all platforms
        run: ./gradlew build

      - name: Publish to Maven Central (USER_MANAGED deployment)
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          # signingInMemoryKeyId is intentionally not set: the keyring holds a
          # single key (auto-selected), Gradle rejects 16-char fingerprints,
          # and a wrong 8-char id fails the build.
