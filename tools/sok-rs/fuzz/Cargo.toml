# The fuzz target of the independent .sok reader (docs/verification/sok-reader.md).
# A workspace of its own: cargo-fuzz needs a nightly toolchain, while the
# reader's workspace pins a stable one. Run it from tools/sok-rs with
# `cargo +nightly fuzz run read`, or through `./gradlew :tools:sok-rs:fuzz`.

[package]
name = "sok-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sok = { path = "../sok" }

[workspace]
members = ["."]

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false
