kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Publishing (VannikTech maven-publish plugin)
# mavenCentralPublishing: wire publishToMavenCentral to the Central Portal API.
# signAllPublications: apply PGP signing to all publications; only enforced for
# non-SNAPSHOT versions, so keyless snapshot builds still work. Signing keys and
# Portal credentials are provided via ~/.gradle/gradle.properties or
# ORG_GRADLE_PROJECT_* environment variables — never committed.
mavenCentralPublishing=true
signAllPublications=true
